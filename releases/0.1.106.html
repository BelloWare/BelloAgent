<h2>Bello Agent 0.1.106</h2>
<ul>
<li>A turn's usage line no longer counts the request that is still running twice. While a reply streamed, one request read as "0 of 2 requests … (2 still running)", and a turn of four requests read "3 of 5"; each request is now counted once, running or finished.</li>
</ul>
