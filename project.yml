name: PiApp
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: 0.1.98
    CURRENT_PROJECT_VERSION: 102
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: 43TXHV3TM3
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    RELEASE_MESSAGE: "Select and copy across a whole reply: its paragraphs, lists, code and tables are one text now, streaming stays as smooth as before, and a reply that is arriving stays under its header."
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.8.1
targets:
  PiApp:
    type: application
    productName: Bello Agent
    platform: macOS
    sources:
      - apps/macos/PiApp
      - packages/swift-host/Sources/PiAgentCore/HistoryWindowPolicy.swift
      - packages/swift-host/Sources/PiAgentCore/EditReplayPlan.swift
      - packages/swift-host/Sources/PiAgentCore/MessageVersions.swift
      - packages/swift-host/Sources/PiAgentCore/TaskPresentation.swift
      - packages/swift-host/Sources/PiAgentCore/ResponseTimeline.swift
      - path: catalogs/bello-agent.models.json
        buildPhase: resources
    postBuildScripts:
      - name: Embed pinned host
        script: /usr/bin/python3 "$SRCROOT/scripts/embed-runtime.py"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.belloware.PiApp
        PRODUCT_NAME: Bello Agent
        PRODUCT_MODULE_NAME: PiApp
        INFOPLIST_FILE: apps/macos/PiApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: apps/macos/PiApp/PiApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  PiAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [apps/macos/PiAppTests]
    dependencies:
      - target: PiApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.belloware.PiAppTests
      configs:
        # Which configuration the bundle was built in, said rather than
        # inferred: the timing tests hold themselves to an absolute
        # millisecond budget only where those milliseconds mean something.
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: [$(inherited), PI_RELEASE_TESTS]
schemes:
  PiApp:
    build:
      targets:
        PiApp: all
    test:
      targets: [PiAppTests]
      environmentVariables:
        PI_APP_TESTING: "1"
