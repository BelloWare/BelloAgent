name: PiApp
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: 0.1.127
    CURRENT_PROJECT_VERSION: 131
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: 43TXHV3TM3
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    RELEASE_MESSAGE: "IntelliJ-style Git tools: hunk staging, a History browser, branches and stash. Browse a file's folders, and switch every project to a flat chat list at once."
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.8.1
  BelloViews:
    path: packages/bello-views
targetTemplates:
  PiApplication:
    type: application
    productName: Bello Agent
    platform: macOS
    sources:
      - apps/macos/PiApp
      - packages/swift-host/Sources/PiAgentCore/HistoryWindowPolicy.swift
      - packages/swift-host/Sources/PiAgentCore/EditReplayPlan.swift
      - packages/swift-host/Sources/PiAgentCore/MessageVersions.swift
      - packages/swift-host/Sources/PiAgentCore/JournalCheckpoint.swift
      - packages/swift-host/Sources/PiAgentCore/TaskPresentation.swift
      - packages/swift-host/Sources/PiAgentCore/ResponseTimeline.swift
      - packages/swift-host/Sources/PiAgentCore/SubagentTypes.swift
      - packages/swift-host/Sources/PiAgentCore/RequestScope.swift
      - packages/swift-host/Sources/PiAgentCore/ToolOutputOwnership.swift
      - path: catalogs/bello-agent.models.json
        buildPhase: resources
    postBuildScripts:
      - name: Embed pinned host
        script: /usr/bin/python3 "$SRCROOT/scripts/embed-runtime.py"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: Sparkle
      - package: BelloViews
        product: BelloFileView
      - package: BelloViews
        product: BelloGitView
      - package: BelloViews
        product: BelloFileFinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.belloware.PiApp
        PRODUCT_NAME: Bello Agent
        PRODUCT_MODULE_NAME: PiApp
        INFOPLIST_FILE: apps/macos/PiApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: apps/macos/PiApp/PiApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
targets:
  PiApp:
    templates: [PiApplication]
  # Test actions (including Release build-for-testing) never launch the
  # shipping app or use its preferences identity. Keep its module for @testable.
  PiAppTestHost:
    templates: [PiApplication]
    productName: Bello Agent Tests
    sources: [apps/macos/TestSupport/TestIsolationGuard.m]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.belloware.PiAppTests.Host
        PRODUCT_NAME: Bello Agent Tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: [$(inherited), PI_TEST_HOST]
        ENABLE_TESTABILITY: YES
  PiAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [apps/macos/PiAppTests, apps/macos/TestSupport/TestIsolationGuard.m]
    dependencies:
      - target: PiAppTestHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.belloware.PiAppTests
      configs:
        # Which configuration the bundle was built in, said rather than
        # inferred: the timing tests hold themselves to an absolute
        # millisecond budget only where those milliseconds mean something.
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: [$(inherited), PI_RELEASE_TESTS]
schemes:
  PiApp:
    build:
      targets:
        PiApp: [run, profile, archive, analyze]
        PiAppTestHost: [test]
    test:
      targets: [PiAppTests]
      macroExpansion: PiAppTestHost
      environmentVariables:
        PI_APP_TESTING: "1"
        # Recorded in .xctestrun too, so clones and test-without-building keep
        # the same isolation without a shell wrapper or a developer's setup.
        CFFIXED_USER_HOME: "$(PROJECT_TEMP_DIR)/PiAppTests-Home"
