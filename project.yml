name: PiApp
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: 0.1.42
    CURRENT_PROJECT_VERSION: 46
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: 43TXHV3TM3
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    RELEASE_MESSAGE: "Deleting a connection that was edited into a new route now works: the catalog link the edit left behind goes with it, the vault is read back to prove the deletion, and a deletion that does not happen says why in the footer and the banner. Saving a changed route keeps Settings open and explains the new tab."
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.8.1
targets:
  PiApp:
    type: application
    productName: Bello Agent
    platform: macOS
    sources:
      - apps/macos/PiApp
      - path: catalogs/bello-agent.models.json
        buildPhase: resources
    postBuildScripts:
      - name: Embed pinned host
        script: /usr/bin/python3 "$SRCROOT/scripts/embed-runtime.py"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.belloware.PiApp
        PRODUCT_NAME: Bello Agent
        PRODUCT_MODULE_NAME: PiApp
        INFOPLIST_FILE: apps/macos/PiApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: apps/macos/PiApp/PiApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  PiAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [apps/macos/PiAppTests]
    dependencies:
      - target: PiApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.belloware.PiAppTests
schemes:
  PiApp:
    build:
      targets:
        PiApp: all
    test:
      targets: [PiAppTests]
      environmentVariables:
        PI_APP_TESTING: "1"
