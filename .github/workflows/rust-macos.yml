name: Rust macOS native checks
on:
  push:
    branches: [rust]
    paths: ['rust/**', 'catalogs/bello-agent.models.json', '.github/workflows/rust-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Finish the running native build; only the newest pending checkpoint waits.
  group: rust-macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apple-silicon:
    # Standard runners are free for public repos; never consume paid private minutes.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify native Apple toolchain
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          export DEVELOPER_DIR="$(xcode-select --print-path)"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --find clang
          xcrun --find metal
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          rustc --version
      - name: Compile and link all native test targets
        run: cargo test --locked --workspace --no-run
      - name: Run pure domain and filesystem tests
        # No GPUI application launch, permissions, keychain, capture or updater actions.
        run: |
          set -o pipefail
          cargo test --locked -p bello-agent-core 2>&1 | tee "$RUNNER_TEMP/bello-agent-core-native.log"
      - name: Bound native Core diagnostic text
        if: always()
        run: |
          python3 - <<'PYLOG'
          import hashlib, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          source = root / "bello-agent-core-native.log"
          target = root / "bello-agent-core-native-bounded.log"
          limit = 2 * 1024 * 1024
          if source.is_file():
              size = source.stat().st_size
              digest = hashlib.sha256()
              with source.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(65536), b""):
                      digest.update(chunk)
                  stream.seek(max(0, size - limit))
                  tail = stream.read(limit)
              header = (f"Synthetic native Core test log; original_bytes={size}; "
                        f"sha256={digest.hexdigest()}; tail_truncated={size > limit}\n")
              target.write_bytes(header.encode() + tail)
          else:
              target.write_text("Native Core test log was not produced; the test step may not have been reached.\n")
          PYLOG
      - name: Retain bounded native Core diagnostic text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-core-text-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bello-agent-core-native-bounded.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Verify and transport same-build UTF-8 decoder bundle
        # Synthetic decoder probes only. Job logs avoid artifact-storage charges.
        # Failure or the size bound must not trigger a paid transfer fallback.
        run: |
          python3 scripts/test-source-utf8-log-transfer.py
          python3 scripts/validate-source-utf8-macos.py build-bundle "$RUNNER_TEMP/a4-modern-bundle"
          python3 scripts/validate-source-utf8-macos.py run-bundle "$RUNNER_TEMP/a4-modern-bundle" --receipt "$RUNNER_TEMP/a4-modern-receipt.json"
          python3 scripts/source-utf8-log-transfer.py emit "$RUNNER_TEMP/a4-modern-bundle" --receipt "$RUNNER_TEMP/a4-modern-receipt.json"
      - name: Verify pinned sidebar SQLite and synthetic privacy fixtures
        # Owned temporary fixtures only. Production cache readiness stays closed.
        # The macOS run exercises native ACL/VFS code, not TCC or GUI acceptance.
        run: |
          cargo fetch --locked
          python3 scripts/check-sidebar-sqlite.py --all-features
          cargo test --locked -p bello-agent-core --all-features sidebar_search::cache:: -- --nocapture
      - name: Retain project skill source and Darwin alias characterization
        # Generated fixtures only; exact matrix plus separately labeled alias gap.
        run: cargo test --locked -p bello-agent-core --test project_skills_native -- --nocapture
      - name: Trusted Bash full feature suites and exact Swift process oracle
        # Owned generated processes and temporary files; no native vault or user data.
        run: |
          cargo test --locked -p bello-agent-core --all-features
          cargo test --locked -p bello-agent-core --all-features --test bash_native -- --nocapture
          cargo test --locked -p bello-agent-app --features synthetic-authority
      - name: Project authority fixture contracts and native type checks
        # Fake API and temporary-file fixtures; no native authority or credentials are accessed.
        run: |
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority project_authority::
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority workspace::identity_tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority runtime::resource_runtime::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority saved_runtime::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority synthetic_project_runtime::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority mcp::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority project_authority::connections::
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority runtime::configuration_tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority runtime::attachment_runtime::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority user_content
          cargo test --locked -p bello-agent-core --lib --features native-authority project_authority::native
          cargo check --locked -p bello-agent-app --all-targets --features synthetic-authority
          cargo test --locked -p bello-agent-app --features synthetic-authority project_host::
          cargo test --locked -p bello-agent-app chat_tool_mode::
          cargo test --locked -p bello-agent-app --features synthetic-authority mcp_inspector
          cargo test --locked -p bello-agent-app --features synthetic-authority composer_attachments::
          cargo test --locked -p bello-agent-app --features synthetic-authority composer_skills::
          cargo test --locked -p bello-agent-app --features synthetic-authority context_inspector::
          cargo test --locked -p bello-agent-app --features synthetic-authority attachment_fixture::
      - name: Synthetic native file tools through fake-platform transcript
        # Temporary files and loopback provider only; GPUI uses its test platform.
        # No native window, input automation, TCC, vault, or user data is accessed.
        run: |
          cargo test --locked -p bello-agent-app --features synthetic-authority read_native_workflow
          cargo test --locked -p bello-agent-app --features synthetic-authority edit_native_workflow
      - name: Explicit native authority host with fake storage
        # Compile/link the native adapter; all exercised storage remains fake.
        # No application launch, signing identity check or Keychain access.
        run: |
          cargo test --locked -p bello-agent-app --features native-authority
          cargo test --locked -p bello-agent-app --features native-authority,synthetic-authority
          cargo build --locked -p bello-agent-app --features native-authority
      - name: Build native applications without launching
        run: cargo build --locked --workspace
      - name: Test native lifecycle harness policy
        run: python3 scripts/native-lifecycle-smoke-macos.py --self-test
      - name: Build explicitly enabled native lifecycle probe
        run: cargo build --locked -p bello-agent-app --features native-lifecycle-smoke
      - name: Observe isolated native own-window lifecycle
        timeout-minutes: 2
        env:
          BELLO_NATIVE_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
        # Own-window visibility and normal close/quit only; no input or pixel parity claim.
        run: python3 scripts/native-lifecycle-smoke-macos.py "$PWD/target/debug/bello-agent"
