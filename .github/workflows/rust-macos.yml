name: Rust macOS native checks
on:
  push:
    branches: [rust]
    paths: ['rust/**', '.github/workflows/rust-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Finish the running native build; only the newest pending checkpoint waits.
  group: rust-macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apple-silicon:
    # Standard runners are free for public repos; never consume paid private minutes.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify native Apple toolchain
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --find clang
          xcrun --find metal
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup override set 1.99.0
          rustc --version
      - name: Compile and link all native test targets
        run: cargo test --locked --workspace --no-run
      - name: Run pure domain and filesystem tests
        # No GPUI application launch, permissions, keychain, capture or updater actions.
        run: cargo test --locked -p bello-agent-core
      - name: Project authority fixture contracts and native type checks
        # Fake API and temporary-file fixtures; no native authority or credentials are accessed.
        run: |
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority project_authority::
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority workspace::identity_tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority runtime::resource_runtime::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority saved_runtime::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority synthetic_project_runtime::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority mcp::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority project_authority::connections::
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority runtime::configuration_tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority runtime::attachment_runtime::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority user_content
          cargo test --locked -p bello-agent-core --lib --features native-authority project_authority::native
          cargo check --locked -p bello-agent-app --all-targets --features synthetic-authority
          cargo test --locked -p bello-agent-app --features synthetic-authority project_host::
          cargo test --locked -p bello-agent-app chat_tool_mode::
          cargo test --locked -p bello-agent-app --features synthetic-authority mcp_inspector
          cargo test --locked -p bello-agent-app --features synthetic-authority composer_attachments::
          cargo test --locked -p bello-agent-app --features synthetic-authority attachment_fixture::
          cargo test --locked -p bello-agent-app --features synthetic-authority context_inspector::
      - name: Synthetic native file tools through fake-platform transcript
        # Temporary files and loopback provider only; GPUI uses its test platform.
        # No native window, input automation, TCC, vault, or user data is accessed.
        run: |
          cargo test --locked -p bello-agent-app --features synthetic-authority read_native_workflow
          cargo test --locked -p bello-agent-app --features synthetic-authority edit_native_workflow
      - name: Build native applications without launching
        run: cargo build --locked --workspace
      - name: Test native lifecycle harness policy
        run: python3 scripts/native-lifecycle-smoke-macos.py --self-test
      - name: Build explicitly enabled native lifecycle probe
        run: cargo build --locked -p bello-agent-app --features native-lifecycle-smoke
      - name: Observe isolated native own-window lifecycle
        timeout-minutes: 2
        env:
          BELLO_NATIVE_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
        # Own-window visibility and normal close/quit only; no input or pixel parity claim.
        run: python3 scripts/native-lifecycle-smoke-macos.py "$PWD/target/debug/bello-agent"
