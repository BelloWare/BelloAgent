name: Rust Linux checks
on:
  push:
    branches: [rust]
    paths: ['rust/**', 'catalogs/bello-agent.models.json', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', 'catalogs/bello-agent.models.json', '.github/workflows/rust.yml']
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    # Never consume paid private-repository runner minutes.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates libfontconfig1-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libasound2-dev libzstd-dev libssl-dev libvulkan-dev cmake clang lld xvfb xauth openbox xdotool imagemagick tesseract-ocr fonts-dejavu-core mesa-vulkan-drivers
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.0
      - name: Prepare private synthetic fixture parent
        # Create only fresh task-owned directories; never change existing runner ACLs.
        # Failures are repeated as an annotation, which is readable without log access.
        run: |
          annotate() { echo "::error title=$1::$(tail -c 900 "$2" | tr '\r\n' '  ')"; }
          if ! fixture="$(sudo python3 scripts/sidebar-ci-fixture.py create --uid "$(id -u)" --gid "$(id -g)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" 2> "$RUNNER_TEMP/fixture-create.err")"; then
            annotate "Synthetic fixture parent creation" "$RUNNER_TEMP/fixture-create.err"; exit 1
          fi
          echo "BELLO_SYNTHETIC_TEST_FIXTURE_PARENT=$fixture" >> "$GITHUB_ENV"
          if ! python3 scripts/sidebar-ci-fixture.py self-test --test-parent "$fixture" > "$RUNNER_TEMP/fixture-self-test.log" 2>&1; then
            annotate "Synthetic fixture self-test" "$RUNNER_TEMP/fixture-self-test.log"; exit 1
          fi
          cat "$RUNNER_TEMP/fixture-self-test.log"
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Core and integration tests
        run: cargo test --locked --workspace
      - name: Verify pinned sidebar SQLite and synthetic privacy fixtures
        # Owned temporary fixtures only. Production cache readiness stays closed.
        # The macOS run exercises native ACL/VFS code, not TCC or GUI acceptance.
        run: |
          cargo fetch --locked
          python3 scripts/check-sidebar-sqlite.py --all-features
          cargo test --locked -p bello-agent-core --all-features sidebar_search::cache:: -- --nocapture
      - name: Project authority fixtures and coordinator checks
        run: |
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority project_authority::
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority workspace::identity_tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority runtime::resource_runtime::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority saved_runtime::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority synthetic_project_runtime::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority mcp::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority project_authority::connections::
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority runtime::configuration_tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority runtime::attachment_runtime::tests
          cargo test --locked -p bello-agent-core --lib --features synthetic-authority user_content
          cargo test --locked -p bello-agent-core --lib --features native-authority project_authority::native
          cargo test --locked -p bello-agent-app --features synthetic-authority project_
          cargo test --locked -p bello-agent-app --features synthetic-authority connection_
          cargo test --locked -p bello-agent-app --features synthetic-authority mcp_inspector
          cargo test --locked -p bello-agent-app --features synthetic-authority composer_attachments::
          cargo test --locked -p bello-agent-app --features synthetic-authority composer_skills::
          cargo test --locked -p bello-agent-app --features synthetic-authority context_inspector::
          cargo test --locked -p bello-agent-app --features synthetic-authority attachment_fixture::
      - name: Trusted Bash full feature regressions
        # Generated process/loopback fixtures only; production authority remains gated.
        run: |
          cargo test --locked -p bello-agent-core --all-features
          cargo test --locked -p bello-agent-app --features synthetic-authority
          cargo clippy --locked -p bello-agent-core --all-targets --all-features -- -D warnings
          cargo clippy --locked -p bello-agent-app --all-targets --features synthetic-authority -- -D warnings
      - name: Lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Explicit native authority composition with fake storage
        # These tests never select Security/Keychain or use actual credentials.
        # The feature alone must leave ordinary startup unavailable.
        run: |
          cargo test --locked -p bello-agent-app --features native-authority
          cargo test --locked -p bello-agent-app --features native-authority,synthetic-authority
          cargo clippy --locked -p bello-agent-app --all-targets --features native-authority -- -D warnings
          cargo clippy --locked -p bello-agent-app --all-targets --features native-authority,synthetic-authority -- -D warnings
      - name: Build native applications
        run: cargo build --locked --workspace
      - name: UI evidence harness self-tests
        run: python3 -m unittest discover -s scripts -p 'test_linux_ui_smoke.py' -v
      - name: Transcript benchmark parser self-tests
        run: python3 -m unittest discover -s scripts -p 'test_transcript_benchmark.py' -v
      - name: Capture current Linux software-rendered UI
        timeout-minutes: 4
        run: |
          VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name "lvp_icd*.json" -print -quit)
          export VK_ICD_FILENAMES
          test -f "$VK_ICD_FILENAMES"
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24 -nolisten tcp" \
            sh -eu -c 'openbox >/dev/null 2>&1 & wm=$!; trap "kill $wm || true" EXIT; python3 scripts/linux-ui-smoke.py agent target/debug/bello-agent "$RUNNER_TEMP/ui-evidence"'
      - name: Summarize Linux UI smoke without artifact storage
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/ui-evidence/report.json"; then
            echo 'Linux software-rendered UI smoke; screenshots are temporary and are not uploaded.' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/ui-evidence/report.json" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Linux UI smoke did not produce a report; inspect earlier failed steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Clean private synthetic fixture parent
        if: always() && env.BELLO_SYNTHETIC_TEST_FIXTURE_PARENT != ''
        run: |
          sudo python3 scripts/sidebar-ci-fixture.py cleanup --root "$BELLO_SYNTHETIC_TEST_FIXTURE_PARENT" --uid "$(id -u)" --gid "$(id -g)" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
