[workspace]
members = ["crates/bello-agent-core", "crates/bello-agent-app"]
default-members = ["crates/bello-agent-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["x11", "wayland", "font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
