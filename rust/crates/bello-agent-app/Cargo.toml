[package]
name = "bello-agent-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
native-lifecycle-smoke = []

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "=0.2.7"

[dependencies]
bello-agent-core = { path = "../bello-agent-core" }
bello-workbench = { git = "https://github.com/BelloWare/BelloBox.git", rev = "393133cd19d134ffd93c3a86449d94a7b1040683" }
bello-workbench-ui = { git = "https://github.com/BelloWare/BelloBox.git", rev = "393133cd19d134ffd93c3a86449d94a7b1040683" }
gpui = { workspace = true, default-features = false, features = ["x11", "wayland", "font-kit"] }
libc = "=0.2.186"
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"

[[bin]]
name = "bello-agent"
path = "src/main.rs"
