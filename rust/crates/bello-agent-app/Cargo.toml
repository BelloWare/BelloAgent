[package]
name = "bello-agent-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
native-lifecycle-smoke = []
native-authority = ["bello-agent-core/native-authority"]
synthetic-authority = ["bello-agent-core/synthetic-authority"]

[lints.rust]
# objc 0.2.7 macros inspect this legacy cfg in the destination crate.
# Expect the value without declaring or enabling a Cargo feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "=0.2.7"

[dependencies]
bello-agent-core = { path = "../bello-agent-core" }
bello-workbench = { git = "https://github.com/BelloWare/BelloBox.git", rev = "4df795c428b73746463e2e8aa679e3c914ae6509" }
bello-workbench-ui = { git = "https://github.com/BelloWare/BelloBox.git", rev = "4df795c428b73746463e2e8aa679e3c914ae6509" }
gpui = { workspace = true, default-features = false, features = ["x11", "wayland", "font-kit"] }
libc = "=0.2.186"
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true
unicode-normalization = "0.1"
url = "2"
unicode-segmentation = "=1.13.3"
zeroize = "1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"

[[bin]]
name = "bello-agent"
path = "src/main.rs"
