[package]
name = "bello-agent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# In-memory QA fixtures only. This never enables native storage or model tools.
synthetic-authority = []
# Compiles the separate native adapter; never selects it through new()/Default.
native-authority = ["dep:security-framework", "dep:security-framework-sys", "dep:core-foundation", "dep:objc2-local-authentication"]

[dependencies]
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
uuid.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
url = "2"
sha2 = "0.10"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"
unicode-normalization = "0.1"
unicode-segmentation = "=1.13.3"
# Transcript Markdown (the same pinned parser BelloBox uses); no HTML renderer.
pulldown-cmark = { version = "=0.13.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "=0.22.1"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGBase", "CGBitmapContext", "CGColorSpace", "CGContext", "CGGeometry", "CGImage"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "CGImageProperties", "objc2-core-graphics"] }
libc = "=0.2.186"
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSObject", "NSEnumerator", "NSError", "NSFileManager", "NSPathUtilities", "NSString", "NSURL", "NSValue", "NSRegularExpression", "NSRange", "NSTextCheckingResult", "NSFileHandle", "NSData", "block2"] }

security-framework = { version = "=3.7.0", optional = true, default-features = false }
security-framework-sys = { version = "=2.17.0", optional = true, default-features = false }
core-foundation = { version = "=0.10.0", optional = true }
objc2-local-authentication = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "LAContext"] }

# Unix process ownership and portable fake-lock contracts use the pinned libc.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = "=0.2.186"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde_json.workspace = true
